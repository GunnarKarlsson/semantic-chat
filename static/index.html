<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semantic Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css?v=10" />
  </head>
  <body>
    <!-- Start page: single centered input -->
    <section id="view-start" class="view view-start" aria-label="Start a chat">
      <div class="start-panel">
        <p class="brand">Semantic Chat</p>
        <h1 class="start-title">Ask something</h1>
        <p class="start-sub">Similar questions reuse a cached answer.</p>
        <form id="start-form" class="start-form" autocomplete="off">
          <label class="sr-only" for="start-input">Message</label>
          <input
            id="start-input"
            name="message"
            type="text"
            placeholder="Type a message and press Enter"
            autofocus
          />
        </form>
      </div>
    </section>

    <!-- Full chat interface -->
    <section id="view-app" class="view view-app is-hidden" aria-label="Chat">
      <aside class="sidebar" aria-label="Previous chats">
        <div class="sidebar-header">
          <span class="sidebar-brand">Semantic Chat</span>
          <div class="sidebar-actions">
            <button
              id="settings-btn"
              class="icon-btn"
              type="button"
              title="Settings"
              aria-label="Settings"
              aria-haspopup="dialog"
              aria-controls="settings-dialog"
            >
              <svg class="icon-gear" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path
                  fill="currentColor"
                  d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.07 7.07 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.77 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.5.39 1.04.7 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.25.1.54 0 .68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"
                />
              </svg>
            </button>
            <button id="new-chat-btn" class="icon-btn" type="button" title="New chat" aria-label="New chat">
              +
            </button>
          </div>
        </div>
        <ul id="chat-list" class="chat-list"></ul>
      </aside>

      <div class="main">
        <header class="main-header">
          <h2 id="chat-title" class="chat-title">New chat</h2>
        </header>

        <div id="message-list" class="message-list" role="log" aria-live="polite"></div>

        <form id="composer-form" class="composer" autocomplete="off">
          <label class="sr-only" for="composer-input">Message</label>
          <input
            id="composer-input"
            name="message"
            type="text"
            placeholder="Send a message"
          />
          <button type="submit" class="send-btn">Send</button>
        </form>
      </div>
    </section>

    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
      <div class="settings-panel">
        <header class="settings-header">
          <h2 id="settings-title">Settings</h2>
          <button
            id="settings-close-btn"
            class="icon-btn"
            type="button"
            title="Close"
            aria-label="Close settings"
          >
            ×
          </button>
        </header>
        <p class="settings-row">
          Cached answers:
          <strong id="cache-entry-count">0</strong>
        </p>
        <p class="settings-hint">Clearing the cache does not delete your chats.</p>
        <button id="clear-cache-btn" class="danger-btn" type="button">Clear cache</button>
      </div>
    </dialog>

    <script src="/app.js?v=10" defer></script>
  </body>
</html>
