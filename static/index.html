<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Semantic Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css?v=2" />
  </head>
  <body>
    <!-- Start page: single centered input -->
    <section id="view-start" class="view view-start" aria-label="Start a chat">
      <div class="start-panel">
        <p class="brand">Semantic Chat</p>
        <h1 class="start-title">Ask something</h1>
        <p class="start-sub">Similar questions reuse a cached answer.</p>
        <form id="start-form" class="start-form" autocomplete="off">
          <label class="sr-only" for="start-input">Message</label>
          <input
            id="start-input"
            name="message"
            type="text"
            placeholder="Type a message and press Enter"
            autofocus
          />
        </form>
      </div>
    </section>

    <!-- Full chat interface -->
    <section id="view-app" class="view view-app is-hidden" aria-label="Chat">
      <aside class="sidebar" aria-label="Previous chats">
        <div class="sidebar-header">
          <span class="sidebar-brand">Semantic Chat</span>
          <button id="new-chat-btn" class="icon-btn" type="button" title="New chat" aria-label="New chat">
            +
          </button>
        </div>
        <ul id="chat-list" class="chat-list"></ul>
      </aside>

      <div class="main">
        <header class="main-header">
          <h2 id="chat-title" class="chat-title">New chat</h2>
        </header>

        <div id="message-list" class="message-list" role="log" aria-live="polite"></div>

        <form id="composer-form" class="composer" autocomplete="off">
          <label class="sr-only" for="composer-input">Message</label>
          <input
            id="composer-input"
            name="message"
            type="text"
            placeholder="Send a message"
          />
          <button type="submit" class="send-btn">Send</button>
        </form>
      </div>
    </section>

    <script src="/app.js?v=2" defer></script>
  </body>
</html>
