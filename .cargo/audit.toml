# cargo-audit configuration (also used by `./scripts/ci.sh` and CI).
#
# Advisories ignored here are transitive through candle-core 0.9.1, which is
# pinned by sentence-transformers-rs. We cannot bump `zip` without an upstream
# candle upgrade. Revisit when candle-core ships a fixed `zip` dependency.

[advisories]
ignore = [
    # zip 1.3.1 via candle-core 0.9.1
    "RUSTSEC-2025-0168",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0548",
]
